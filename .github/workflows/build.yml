name: Build Umbra

# Наименьшие привилегии по умолчанию: сборочные джобы читают код и НЕ должны
# иметь права записи в репозиторий. Право записи выдаётся точечно только джобу
# release (ниже). Рекомендация по укреплению цепочки поставки: закрепить экшены
# за конкретными commit SHA вместо плавающих тегов (@v4/@v5/@v2).
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # не сохранять токен в .git/config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Используем 3.14 согласно AGENTS.md
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd src
          UMBRA_VERSION="${{ github.ref_name }}" python set_version.py

      - name: Build with PyInstaller
        run: |
          cd src
          python build.py

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-Build
          path: Umbra.exe # Теперь build.py генерирует один файл

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Используем 3.14
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          cd src
          python build.py

      - name: Archive build
        run: |
          mkdir Umbra-macOS
          mv Umbra.app Umbra-macOS/
          tar -czf Umbra-macOS.tar.gz Umbra-macOS/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-macOS
          path: Umbra-macOS.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Устанавливаем системные библиотеки, необходимые для Tkinter/CustomTkinter на Linux
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Build with PyInstaller
        run: |
          cd src
          python build.py

      - name: Archive build
        run: |
          mkdir Umbra-Linux
          mv Umbra Umbra-Linux/
          tar -czf Umbra-Linux.tar.gz Umbra-Linux/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-Linux
          path: Umbra-Linux.tar.gz

  release:
    needs: [build, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Право записи выдаётся ТОЛЬКО этому джобу — он публикует релиз.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Umbra-Build

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Umbra-macOS

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Umbra-Linux

      - name: Prepare OS-specific Archives
        run: |
          # Windows
          mkdir -p Umbra-Windows
          mv Umbra.exe Umbra-Windows/
          zip -r Umbra-Windows.zip Umbra-Windows/
          
          # macOS
          tar -xzf Umbra-macOS.tar.gz
          zip -r Umbra-macOS.zip Umbra-macOS/
          
          # Linux
          tar -xzf Umbra-Linux.tar.gz
          zip -r Umbra-Linux.zip Umbra-Linux/

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            Umbra-Windows.zip
            Umbra-macOS.zip
            Umbra-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
