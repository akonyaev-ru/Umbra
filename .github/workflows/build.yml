name: Build Umbra

# Наименьшие привилегии по умолчанию: сборочные джобы читают код и НЕ должны
# иметь права записи в репозиторий. Право записи выдаётся точечно только джобу
# release (ниже). Рекомендация по укреплению цепочки поставки: закрепить экшены
# за конкретными commit SHA вместо плавающих тегов (@v4/@v5/@v2).
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # не сохранять токен в .git/config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Используем 3.14 согласно AGENTS.md
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd src
          UMBRA_VERSION="${{ github.ref_name }}" python set_version.py

      - name: Build with PyInstaller
        run: |
          cd src
          python build.py

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-Build
          path: Umbra.exe # Теперь build.py генерирует один файл

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Используем 3.14
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          cd src
          python build.py

      - name: Archive build
        run: |
          mkdir Umbra-macOS
          mv Umbra.app Umbra-macOS/
          tar -czf Umbra-macOS.tar.gz Umbra-macOS/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-macOS
          path: Umbra-macOS.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Tcl/Tk runtime
        run: |
          sudo apt-get update
          # ВАЖНО: сборка идёт интерпретатором от actions/setup-python, а python3-tk
          # кладёт модуль tkinter для СИСТЕМНОГО python3 и на сборку прямо не влияет —
          # он лишь ПОБОЧНО подтягивал libtcl/libtk, на которые линкуется _tkinter из
          # setup-python. Ставим эти библиотеки явно, чтобы сборка не держалась на
          # случайности; python3-tk оставлен как проверенный запасной вариант.
          sudo apt-get install -y tk-dev libtcl8.6 libtk8.6 python3-tk

      - name: Install dependencies
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          cd src
          python build.py

      - name: Archive build
        run: |
          mkdir Umbra-Linux
          mv Umbra Umbra-Linux/
          tar -czf Umbra-Linux.tar.gz Umbra-Linux/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-Linux
          path: Umbra-Linux.tar.gz

  release:
    needs: [build, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Право записи выдаётся ТОЛЬКО этому джобу — он публикует релиз.
    permissions:
      contents: write
    steps:
      # checkout нужен только ради release_notes.md (body_path).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Umbra-Build

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Umbra-macOS

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Umbra-Linux

      - name: Prepare OS-specific Archives
        run: |
          # Флаг -y обязателен: без него zip ИДЁТ ПО симлинкам и сохраняет их как
          # обычные файлы, ломая структуру .app-бандла macOS. Права доступа
          # (в т.ч. бит исполнения) zip хранит в атрибутах — их unzip восстановит.
          # Windows
          mkdir -p Umbra-Windows
          mv Umbra.exe Umbra-Windows/
          zip -r -y Umbra-Windows.zip Umbra-Windows/

          # macOS
          tar -xzf Umbra-macOS.tar.gz
          zip -r -y Umbra-macOS.zip Umbra-macOS/

          # Linux
          tar -xzf Umbra-Linux.tar.gz
          zip -r -y Umbra-Linux.zip Umbra-Linux/

      # Удаляем старый релиз ТОЛЬКО когда архивы уже собраны и готовы к публикации.
      # Раньше этот шаг стоял первым: если падал любой шаг ниже, релиз был уже
      # удалён, а новый не создан — пользователи оставались вообще без релиза.
      - name: Cleanup old release (if any)
        run: |
          gh release delete ${{ github.ref_name }} -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            Umbra-Windows.zip
            Umbra-macOS.zip
            Umbra-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
