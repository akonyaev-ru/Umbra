name: Build Umbra

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Используем 3.14 согласно AGENTS.md
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Build with PyInstaller
        run: |
          cd src
          python build.py
          
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-Build
          path: Umbra.exe # Теперь build.py генерирует один файл

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Используем 3.14
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Build with PyInstaller
        run: |
          cd src
          python build.py
          
      - name: Archive build
        run: |
          # Упаковываем .app бандл в tar.gz, чтобы сохранить права доступа
          tar -czf Umbra-macOS.tar.gz Umbra.app
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-macOS
          path: Umbra-macOS.tar.gz

  release:
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Umbra-Build
          
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Umbra-macOS
          
      - name: Create ZIP archive
        run: zip Umbra-Release.zip Umbra.exe
        
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Umbra.exe
            Umbra-Release.zip
            Umbra-macOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
